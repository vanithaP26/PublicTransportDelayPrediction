{% extends "base.html" %}
{% block content %}

<style>
.flash {
  padding: 10px;
  border-radius: 6px;
  margin-bottom: 10px;
  font-size: 14px;
}

.flash-ok {
  background: #e8f5e9;
  border: 1px solid #a5d6a7;
  color: #1b5e20;
}

.flash-error {
  background: #ffebee;
  border: 1px solid #ef9a9a;
  color: #b71c1c;
}
</style>

<div style="max-width:720px;margin:40px auto;background:#fff;padding:28px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.06);">
  <h2 style="color:#0b63d6;margin-top:0;">Login</h2>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for cat, msg in messages %}
        <div class="flash {{ 'flash-ok' if cat=='ok' else 'flash-error' }}">
          {{ msg }}
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="post"
        action="{{ url_for('login') }}"
        autocomplete="off"
        style="display:grid;gap:12px;">

    <label>Email</label>
    <input type="email"
           name="email"
           autocomplete="off"
           required
           style="padding:10px;border:1px solid #e2e8f0;border-radius:8px;">

    <label>Password</label>
    <input type="password"
           name="password"
           autocomplete="new-password"
           required
           style="padding:10px;border:1px solid #e2e8f0;border-radius:8px;">

    <button type="submit" class="btn btn-primary" style="width:100%;">Login</button>
  </form>

  <div style="display:flex;justify-content:space-between;margin-top:10px;font-size:14px;">
    <a href="{{ url_for('signup_page') }}">Don't have an account? Create one</a>
  </div>
</div>

{% endblock %}
