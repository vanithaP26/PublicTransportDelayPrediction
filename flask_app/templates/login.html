{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for cat, msg in messages %}
      {% if cat == 'ok' %}
        <div style="padding:10px;border-radius:6px;margin-bottom:10px;
                    background:#e8f5e9;border:1px solid #a5d6a7;">
          {{ msg }}
        </div>
      {% else %}
        <div style="padding:10px;border-radius:6px;margin-bottom:10px;
                    background:#ffebee;border:1px solid #ef9a9a;">
          {{ msg }}
        </div>
      {% endif %}
    {% endfor %}
  {% endif %}
{% endwith %}


  <!-- IMPORTANT: autocomplete disabled -->
  <form method="post"
        action="{{ url_for('login') }}"
        style="display:grid;gap:12px;"
        autocomplete="off">

    <!-- Chrome autofill trap (DO NOT REMOVE) -->
    <input type="text" name="fakeusernameremembered" style="display:none">
    <input type="password" name="fakepasswordremembered" style="display:none">

    <label>Email</label>
    <input type="email"
           name="email"
           placeholder="Enter your email"
           autocomplete="off"
           required
           style="padding:10px;border:1px solid #e2e8f0;border-radius:8px;">

    <label>Password</label>
    <input type="password"
           name="password"
           placeholder="Enter your password"
           autocomplete="new-password"
           required
           style="padding:10px;border:1px solid #e2e8f0;border-radius:8px;">

    <button type="submit"
            class="btn btn-primary"
            style="width:100%;margin-top:8px;">
      Login
    </button>
  </form>

  <div style="display:flex;justify-content:space-between;margin-top:12px;font-size:14px;">
    <a href="{{ url_for('signup_page') }}">Don't have an account? Create one</a>
  </div>
</div>

{% endblock %}
