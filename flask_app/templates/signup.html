{% extends "base.html" %}
{% block content %}

<style>
  .auth-card {
    max-width: 720px;
    margin: 40px auto;
    background: #fff;
    padding: 28px;
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,.06);
  }

  .auth-card h2 {
    color: #0b63d6;
    margin-top: 0;
  }

  .alert-ok {
    background: #e8f5e9;
    border: 1px solid #a5d6a7;
    padding: 10px;
    border-radius: 6px;
    margin-bottom: 10px;
  }

  .alert-error {
    background: #ffebee;
    border: 1px solid #ef9a9a;
    padding: 10px;
    border-radius: 6px;
    margin-bottom: 10px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .form-group input {
    padding: 10px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    font-size: 14px;
  }

  .password-wrap {
    position: relative;
  }

  .toggle-eye {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 14px;
    color: #64748b;
  }
</style>

<div class="auth-card">
  <h2>Create an account</h2>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for cat, msg in messages %}
        <div class="{{ 'alert-ok' if cat == 'ok' else 'alert-error' }}">
          {{ msg }}
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="post" action="{{ url_for('signup') }}" style="display:grid;gap:14px;">

    <div class="form-group">
      <label>Full name</label>
      <input type="text" name="name" required>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" required autocomplete="off">
    </div>

    <div class="form-group password-wrap">
      <label>Password</label>
      <input type="password" id="password" name="password" required autocomplete="new-password">
      <span class="toggle-eye" onclick="togglePwd('password')">👁️</span>
    </div>

    <div class="form-group password-wrap">
      <label>Confirm Password</label>
      <input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password">
      <span class="toggle-eye" onclick="togglePwd('confirm_password')">👁️</span>
    </div>

    <button type="submit" class="btn btn-primary" style="width:100%;">
      Create Account
    </button>
  </form>

  <div style="text-align:center;margin-top:10px;font-size:14px;">
    <a href="{{ url_for('login_page') }}">Already have an account? Login</a>
  </div>
</div>

<script>
function togglePwd(id) {
  const input = document.getElementById(id);
  input.type = input.type === "password" ? "text" : "password";
}
</script>

{% endblock %}
