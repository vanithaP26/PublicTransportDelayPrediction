{% extends "base.html" %}
{% block content %}

<style>
.feedback-container {
    max-width: 520px;
    margin: 60px auto;
    background: #ffffff;
    padding: 35px 40px;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.12);
}

.feedback-title {
    text-align: center;
    font-size: 26px;
    font-weight: 600;
    color: #0d6efd;
    margin-bottom: 5px;
}

.feedback-sub {
    text-align: center;
    color: #6b7280;
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 18px;
}

label {
    font-weight: 500;
    display: block;
    margin-bottom: 6px;
}

input, textarea {
    width: 100%;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid #d1d5db;
    font-size: 15px;
}

textarea {
    resize: none;
    height: 90px;
}

.rating-group {
    display: flex;
    gap: 10px;
    margin-top: 8px;
}

.rating-group label {
    font-size: 20px;
    cursor: pointer;
}

input[type="radio"] {
    display: none;
}

input[type="radio"]:checked + span {
    color: #facc15;
}

.submit-btn {
    width: 100%;
    margin-top: 20px;
    background: #2563eb;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

.submit-btn:hover {
    background: #1e40af;
}
</style>

<div class="feedback-container">
    <h2 class="feedback-title">💬 Share Your Feedback</h2>
    <p class="feedback-sub">Your feedback helps us to improve the system</p>

    <form method="POST" action="{{ url_for('feedback') }}">
        
        <div class="form-group">
            <label>Your Name</label>
            <input type="text" name="name" required>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" required>
        </div>

        <div class="form-group">
            <label>Your Feedback</label>
            <textarea name="message" placeholder="Write your feedback here..." required></textarea>
        </div>

        <button type="submit" class="submit-btn">Submit Feedback</button>
    </form>
</div>

{% endblock %}
