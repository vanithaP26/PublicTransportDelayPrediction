{% extends "base.html" %}

{% block content %}
<style>
  .login-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 75vh;
  }

  .login-box {
    width: 380px;
    background: #ffffff;
    padding: 35px 32px;
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
  }

  .login-box h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #0d6efd;
    font-weight: 600;
  }

  .input-group {
    margin-bottom: 18px;
  }

  .input-group label {
    font-weight: 600;
    display: block;
    margin-bottom: 6px;
  }

  .input-group input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 14px;
  }

  .btn-login {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    background: #0d6efd;
    color: #fff;
    border: none;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
  }

  .btn-login:hover {
    background: #084fc1;
  }

  .hint {
    text-align: center;
    margin-top: 12px;
    font-size: 13px;
    color: #666;
  }
</style>

<div class="login-wrapper">
  <form class="login-box" method="POST" action="{{ url_for('admin_login') }}">
    <h2>Admin Login</h2>

    <div class="input-group">
      <label for="email">Admin Email</label>
      <input type="email" name="username" id="email" placeholder="admin@gmail.com" required>
    </div>

    <div class="input-group">
      <label for="password">Password</label>
      <input type="password" name="password" id="password" placeholder="Enter password" required>
    </div>

    <button type="submit" class="btn-login">Login</button>

    <div class="hint">
      Authorized admin access only
    </div>
  </form>
</div>
{% endblock %}
